[package]
name = "signal-light-native"
version = "0.1.1"
edition = "2021"
description = "Native runtime for the Signal Light agent status display"
license = "MIT"

[lib]
name = "signal_light_native"
path = "src/lib.rs"

[[bin]]
name = "signal-light-native"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[target.'cfg(target_os = "macos")'.dependencies]
hidapi = "2.6"

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw"] }

[dev-dependencies]
tempfile = "3.15"
